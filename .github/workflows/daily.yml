name: daily

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run daily
        run: node scripts/daily.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Claude Code
        if: ${{ env.HAS_CLAUDE_TOKEN == 'true' }}
        run: npm install -g @anthropic-ai/claude-code@2.1.329
      - name: Translate descriptions
        if: ${{ env.HAS_CLAUDE_TOKEN == 'true' }}
        continue-on-error: true
        run: node scripts/translate.js
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898569+github-actions[bot]@users.noreply.github.com"
          git diff --quiet data || (git add data && git commit -m "data: daily $(date -u +%F)" && git pull --rebase && git push)
